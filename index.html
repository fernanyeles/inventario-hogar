<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<title>Inventario del hogar</title>
</head>
<body>
<header>
  <h1>Inventario del hogar</h1>
  <p class="sub" id="st">Cargando…</p>
</header>
<div id="login" hidden>
  <form class="card" id="loginForm">
    <div class="nm">Entrar</div>
    <p class="mu">Usad el correo y la contraseña que creasteis en Firebase.</p>
    <input id="em" type="email" autocomplete="username" placeholder="Correo" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <button class="p" type="submit">Entrar</button>
    <p class="r" id="loginErr"></p>
  </form>
</div>
<main id="m"></main>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
